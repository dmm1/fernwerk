[package]
name = "ssh-core"
description = "SSH engine for the Fernwerk desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "macros", "rt"] }
tracing = "0.1.44"

[dev-dependencies]
rand = { version = "0.10", features = ["thread_rng"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
