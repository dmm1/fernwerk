[package]
name = "ssh-core"
description = "SSH engine for the Fernwerk desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "macros", "net", "rt", "time"] }
tracing = "0.1.44"
zeroize = { version = "1.9.1", features = ["serde"] }

[dev-dependencies]
base64 = "0.22"
hmac = "0.13"
rand = { version = "0.10", features = ["thread_rng"] }
sha1 = "0.11"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
