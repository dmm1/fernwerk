[package]
name = "vault"
description = "Encrypted local store for saved hosts and credentials"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
argon2 = "0.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["serde", "derive"] }

[dev-dependencies]
tempfile = "3.27.0"
