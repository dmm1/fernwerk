[package]
name = "fernwerk-desktop"
description = "Fernwerk SSH desktop client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "fernwerk_desktop_lib"
crate-type = ["rlib"]

[dependencies]
keyring = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ssh-core.workspace = true
tauri = { version = "2.12.5", features = [] }
tokio = { version = "1.54.1", features = ["sync"] }
tracing = "0.1.44"
vault.workspace = true
zeroize = { version = "1.9.1", features = ["serde"] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dev-dependencies]
tempfile = "3.27.0"
