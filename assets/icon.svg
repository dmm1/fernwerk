<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2B3A"/>
      <stop offset="1" stop-color="#0B141D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EF2C4"/>
      <stop offset="1" stop-color="#2BB3E0"/>
    </linearGradient>
    <!-- User-space so the flat cursor line (zero-height bbox) still gets painted. -->
    <linearGradient id="prompt" gradientUnits="userSpaceOnUse" x1="262" y1="452" x2="520" y2="612">
      <stop offset="0" stop-color="#5EF2C4"/>
      <stop offset="1" stop-color="#2BB3E0"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22374A"/>
      <stop offset="1" stop-color="#15222F"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="222" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="4"/>

  <!-- Terminal window -->
  <g filter="url(#shadow)">
    <rect x="172" y="232" width="680" height="520" rx="64" fill="url(#win)"/>
    <rect x="172" y="232" width="680" height="520" rx="64" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
    <!-- Title bar dots -->
    <circle cx="246" cy="302" r="16" fill="#FF6B6B"/>
    <circle cx="298" cy="302" r="16" fill="#FFC857"/>
    <circle cx="350" cy="302" r="16" fill="#5EF2C4"/>
    <line x1="172" y1="352" x2="852" y2="352" stroke="#ffffff" stroke-opacity="0.06" stroke-width="4"/>
  </g>

  <!-- Prompt chevron and cursor -->
  <g filter="url(#glow)" fill="none" stroke="url(#prompt)" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="262,452 362,532 262,612" stroke-width="44"/>
    <line x1="408" y1="612" x2="520" y2="612" stroke-width="44"/>
  </g>

  <!-- Key badge -->
  <g transform="translate(706 532) scale(0.66)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="150" fill="url(#accent)"/>
    <g fill="none" stroke="#0B141D" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-38" cy="-38" r="46"/>
      <line x1="-5" y1="-5" x2="78" y2="78"/>
      <line x1="44" y1="44" x2="72" y2="16"/>
      <line x1="66" y1="66" x2="94" y2="38"/>
    </g>
  </g>
</svg>
