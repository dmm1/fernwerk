name: Release

# Pushed by `pnpm release patch|minor|major`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Build provenance attestations (actions/attest-build-provenance).
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          # Oldest supported runner, so the Linux bundles run on older glibc.
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundles; the public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          # latest.json, which installed apps poll via releases/latest/download.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tagName: ${{ github.ref_name }}
          releaseName: Fernwerk ${{ github.ref_name }}
          # Placeholder while building; the publish job replaces it with the
          # notes from scripts/release-notes.sh.
          releaseBody: Building installers…
          # Stays a draft until every build has uploaded; the publish job releases it.
          releaseDraft: true
          prerelease: false
      # Proves each installer was built by this workflow from this commit.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            target/**/bundle/msi/*.msi
            target/**/bundle/nsis/*.exe
            target/**/bundle/dmg/*.dmg
            target/**/bundle/macos/*.app.tar.gz
            target/**/bundle/deb/*.deb
            target/**/bundle/rpm/*.rpm
            target/**/bundle/appimage/*.AppImage

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Add SHA256SUMS.txt to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --dir assets
          cd assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber

  # Only reached when every build and the checksums succeeded, so installed
  # apps never see a latest.json that is missing a platform.
  publish:
    needs: checksums
    runs-on: ubuntu-latest
    steps:
      # Full history and tags, so the notes can find the previous release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Write release notes and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          bash scripts/release-notes.sh "$TAG" "$GH_REPO" > notes.md
          cat notes.md
          gh release edit "$TAG" --notes-file notes.md --draft=false --latest
